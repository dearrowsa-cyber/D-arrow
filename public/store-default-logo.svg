<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <!-- Phosphor Neon Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10F5A3" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10F5A3" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.2" />
    </linearGradient>

    <!-- Dark Titanium Shield Base -->
    <linearGradient id="shieldBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121D2B" />
      <stop offset="100%" stop-color="#070E17" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="14" y="14" width="212" height="212" rx="52" fill="url(#shieldBase)" stroke="url(#neonGrad)" stroke-width="3.5" />

  <!-- Ambient Neon Radial Glow -->
  <circle cx="120" cy="120" r="65" fill="url(#glowGrad)" opacity="0.3" filter="url(#neonGlow)" />

  <!-- Stylized Geometric Shopping Crown & Diamond Emblem -->
  <!-- Upper Crown Peak -->
  <path d="M 68 108 L 92 68 L 120 90 L 148 68 L 172 108 Z" fill="url(#neonGrad)" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" opacity="0.95" filter="url(#coreGlow)" />

  <!-- Lower Faceted Body -->
  <path d="M 68 108 L 120 182 L 172 108 Z" fill="url(#neonGrad)" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" opacity="0.9" filter="url(#coreGlow)" />

  <!-- Center Luminous Prism -->
  <polygon points="120,90 94,108 120,172 146,108" fill="#FFFFFF" opacity="0.75" />

  <!-- Phosphor Sparkles / Stars -->
  <path d="M 120 38 L 123 48 L 133 51 L 123 54 L 120 64 L 117 54 L 107 51 L 117 48 Z" fill="#10F5A3" filter="url(#coreGlow)" />
  <path d="M 188 78 L 190 84 L 196 86 L 190 88 L 188 94 L 186 88 L 180 86 L 186 84 Z" fill="#00E5FF" filter="url(#coreGlow)" />
  <path d="M 52 78 L 54 84 L 60 86 L 54 88 L 52 94 L 50 88 L 44 86 L 50 84 Z" fill="#10F5A3" filter="url(#coreGlow)" />

  <!-- Fast Forward / Arrow Motif Accent -->
  <path d="M 108 135 L 120 123 L 132 135" stroke="#070E17" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
