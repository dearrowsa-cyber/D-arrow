name: Deploy to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy App to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [Deploy] Starting production deployment..."
            
            # Go to project directory
            cd /home/darrow/project
            
            echo "📥 [Git] Pulling latest changes from origin/main..."
            git pull origin main
            
            echo "🔨 [Docker] Rebuilding Next.js application container..."
            docker compose build d-arrow-app --no-cache || docker compose build app --no-cache
            
            echo "🔄 [Docker] Starting updated container..."
            docker compose up -d d-arrow-app || docker compose up -d app
            
            echo "🧹 [Docker] Cleaning up dangling images..."
            docker image prune -f
            
            echo "✅ [Deploy] Deployment completed successfully!"
