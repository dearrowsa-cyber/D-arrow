name: Deploy to VPS (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Re-deploy Next.js Container
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy over SSH to production VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /home/darrow/project
            echo "[deploy] Pulling latest code from main..."
            git pull origin main
            echo "[deploy] Rebuilding Next.js container (no cache)..."
            docker compose build d-arrow-app --no-cache
            echo "[deploy] Restarting app with zero-downtime (DB container untouched)..."
            docker compose up -d d-arrow-app
            echo "[deploy] Deployment finished successfully."