name: Deploy to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Re-deploy Next.js Container
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          echo "Checking required secrets..."
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "❌ ERROR: VPS_HOST secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "❌ ERROR: VPS_USER secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "❌ ERROR: VPS_SSH_KEY secret is not set!"
            exit 1
          fi
          echo "✅ All required secrets are present."
          echo "Host length: ${#VPS_HOST}"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}

      - name: Deploy over SSH to production VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            echo "🚀 [Deploy] Starting production deployment..."
            cd /home/darrow/project
            echo "📥 [Git] Pulling latest code from main..."
            git pull origin main
            echo "🔨 [Docker] Rebuilding Next.js container (no cache)..."
            docker compose -p d-arrow-new build d-arrow-app --no-cache
            echo "🔄 [Docker] Starting updated container..."
            docker compose -p d-arrow-new up -d --no-deps d-arrow-app
            echo "🧹 [Docker] Cleaning up dangling images..."
            docker image prune -f
            echo "✅ [Deploy] Deployment finished successfully."